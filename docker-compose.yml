services:
  db:
    image: postgres:16-alpine
    container_name: ikk_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ikk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ikk_password}
      POSTGRES_DB: ${POSTGRES_DB:-ikk_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ikk_user} -d ${POSTGRES_DB:-ikk_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ikk_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://ikk_user:ikk_password@db:5432/ikk_db}
      - SECRET_KEY=${SECRET_KEY:-change-me-to-a-super-secret-random-key-in-production-min-32-chars}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-25}
      - SIMPAN_KONTEN_DB=${SIMPAN_KONTEN_DB:-false}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - ENABLE_API_DOCS=${ENABLE_API_DOCS:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - CORS_ORIGIN_REGEX=${CORS_ORIGIN_REGEX:-}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-admin@#!}
      - DEMO_INITIAL_PASSWORD=${DEMO_INITIAL_PASSWORD:-Password123!}
    volumes:
      - ikk_uploads:/app/uploads
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ikk_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  postgres_data:
  ikk_uploads:
